<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile / Bitter</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-wrapper">
        <!-- Sidebar -->
        <nav class="sidebar">
            <div style="padding: 10px 15px; margin-bottom: 25px;">
                <img src="logo.png" style="width: 44px; height: 44px; object-fit: contain; filter: drop-shadow(0 4px 10px rgba(124, 58, 237, 0.5));">
            </div>
            <a href="index.html" class="nav-item">
                <svg viewBox="0 0 24 24" style="width: 26px; fill: currentColor;"><g><path d="M12 2.25l-9.5 8.5 1.5 1.5L12 5.25l8 7.125 1.5-1.5L12 2.25zM5 21V11.25l1.5 1.5V19h11v-6.25l1.5-1.5V21H5z"></path></g></svg>
                <span>Home</span>
            </a>
            <div class="nav-item active" onclick="showProfile(localStorage.getItem('username'))">
                <svg viewBox="0 0 24 24" style="width: 26px; fill: currentColor;"><g><path d="M12 12.25c-2.623 0-4.75-2.127-4.75-4.75s2.127-4.75 4.75-4.75 4.75 2.127 4.75 4.75-2.127 4.75-4.75 4.75zm-3.25-4.75c0 1.792 1.458 3.25 3.25 3.25s3.25-1.458 3.25-3.25-1.458-3.25-3.25-3.25-3.25 1.458-3.25 3.25zM12 13.5c-3.171 0-6.25 1.258-6.25 4v2.75h12.5V17.5c0-2.742-3.079-4-6.25-4zm-4.75 5.25v-1.25c0-1.442 1.64-2.5 4.75-2.5s4.75 1.058 4.75 2.5v1.25H7.25z"></path></g></svg>
                <span>Profile</span>
            </div>
            <div class="nav-item" onclick="logout()" style="margin-top: auto; color: var(--text-muted); opacity: 0.6; font-size: 16px;">
                <svg viewBox="0 0 24 24" style="width: 22px; fill: currentColor;"><g><path d="M12 2.25a.75.75 0 000 1.5h7.5V20.25H12a.75.75 0 000 1.5h7.5a1.5 1.5 0 001.5-1.5V3.75a1.5 1.5 0 00-1.5-1.5H12zM3.53 11.47l3.5-3.5 1.06 1.06L5.81 11.25H15v1.5H5.81l2.28 2.28-1.06 1.06-3.5-3.5a.75.75 0 010-1.06z"></path></g></svg>
                <span>Logout</span>
            </div>
        </nav>

        <!-- Profile Content -->
        <main class="main-content">
            <header class="page-header" style="display: flex; flex-direction: column; gap: 10px; align-items: flex-start;">
                <div style="display: flex; gap: 20px; align-items: center; width: 100%;">
                    <div onclick="history.back()" style="cursor: pointer;">
                        <svg viewBox="0 0 24 24" style="width: 20px; fill: var(--text);"><g><path d="M7.414 13l5.043 5.04-1.414 1.42L3.586 12l7.457-7.46 1.414 1.42L7.414 11H21v2H7.414z"></path></g></svg>
                    </div>
                    <div>
                        <h2 id="profile-display-name">...</h2>
                        <div id="tweet-count" style="font-size: 13px; color: var(--text-muted);">0 tweets</div>
                    </div>
                </div>
                <!-- Mobile Search -->
                <div class="mobile-search-container">
                    <div class="mobile-search-bar">
                        <svg class="mobile-search-icon" viewBox="0 0 24 24"><g><path d="M10.25 3.75c-3.59 0-6.5 2.91-6.5 6.5s2.91 6.5 6.5 6.5c1.795 0 3.419-.726 4.596-1.904 1.178-1.177 1.904-2.801 1.904-4.596 0-3.59-2.91-6.5-6.5-6.5zm-8.5 6.5c0-4.694 3.806-8.5 8.5-8.5s8.5 3.806 8.5 8.5c0 1.986-.682 3.815-1.824 5.262l4.781 4.781-1.414 1.414-4.781-4.781c-1.447 1.142-3.276 1.824-5.262 1.824-4.694 0-8.5-3.806-8.5-8.5z"></path></g></svg>
                        <input type="text" id="mobile-search-input" class="mobile-search-input" placeholder="Search Bitter">
                        <div id="mobile-search-results" class="mobile-search-results">
                            <div id="mobile-results-list" style="padding: 10px;"></div>
                        </div>
                    </div>
                </div>
            </header>

            <div class="profile-banner"></div>
            
            <div class="profile-info">
                <img id="profile-avatar" src="https://bitter-app-uploads.s3.ap-south-1.amazonaws.com/default-avatar.png" class="profile-avatar-large" alt="Profile Picture">
                
                <div class="profile-actions" id="profile-actions">
                    <!-- Follow or Edit button injected here -->
                </div>

                <div class="profile-name-section">
                    <h2 id="profile-username">...</h2>
                    <div id="profile-handle" style="color: var(--text-muted); font-size: 15px;">@...</div>
                </div>

                <p id="profile-bio" class="bio">No bio provided.</p>

                <div class="stats">
                    <span id="following-count"><b>0</b> Following</span>
                    <span id="followers-count"><b>0</b> Followers</span>
                </div>
            </div>

            <div class="tabs">
                <div class="tab active">Tweets</div>
            </div>

            <div id="feed-container">
                <!-- User's tweets will be loaded here -->
            </div>
        </main>

        <!-- Right Sidebar Search -->
        <aside class="right-sidebar">
            <div class="search-container elevated-3d">
                <svg viewBox="0 0 24 24" style="width: 18px; fill: var(--text-muted);"><g><path d="M10.25 3.75c-3.59 0-6.5 2.91-6.5 6.5s2.91 6.5 6.5 6.5c1.795 0 3.419-.726 4.596-1.904 1.178-1.177 1.904-2.801 1.904-4.596 0-3.59-2.91-6.5-6.5-6.5zm-8.5 6.5c0-4.694 3.806-8.5 8.5-8.5s8.5 3.806 8.5 8.5c0 1.986-.682 3.815-1.824 5.262l4.781 4.781-1.414 1.414-4.781-4.781c-1.447 1.142-3.276 1.824-5.262 1.824-4.694 0-8.5-3.806-8.5-8.5z"></path></g></svg>
                <input type="text" id="search-input" class="search-input" placeholder="Search Bitter">
            </div>
            <div id="search-results" class="card elevated-3d" style="display: none; margin-top: 20px; padding: 15px;">
                <div id="results-list"></div>
            </div>
        </aside>
    </div>

    <!-- Edit Profile Modal -->
    <div id="edit-modal" class="modal-overlay">
        <div class="modal elevated-3d">
            <h2 style="margin-bottom: 20px;">Edit Profile</h2>
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; color: var(--text-muted);">Bio</label>
                <textarea id="edit-bio" class="auth-input" style="min-height: 100px;"></textarea>
            </div>
            <div style="margin-bottom: 25px;">
                <label style="display: block; margin-bottom: 5px; color: var(--text-muted);">Profile Picture</label>
                <input type="file" id="profile-pic-input" class="auth-input" accept="image/*">
            </div>
            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button class="btn btn-outline" onclick="closeEditModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveProfile()">Save Changes</button>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>
    <script src="app.js"></script>
</body>
</html>
